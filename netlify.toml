[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  # @netlify/database brings pg / ws / @neondatabase/serverless along; inlining pg is the classic
  # esbuild failure (its optional pg-native require), so these ship as real node_modules.
  external_node_modules = ["@netlify/database", "@neondatabase/serverless", "pg", "ws", "waddler", "@netlify/runtime-utils"]

# Netlify's pretty-URL post-processing 301s /how-it-works to /how-it-works/,
# because the guide is a directory index (how-it-works/index.html). That hop is
# not free: the sitemap, the canonical link and og:url all advertise the
# extensionless URL, so every crawler that follows them lands on a redirect and
# the explicit 200 rule below never fires at all. Turning the rewrite off makes
# the URL we publish the URL we serve, which is the whole point of the pass that
# added the second HTML entry.
[build.processing.html]
  pretty_urls = false

[build.environment]
  NODE_VERSION = "22"
  # Vite inlines VITE_* variables into the client bundle at build time, so these
  # are public by construction — the "publishable" key is meant to ship to the
  # browser. Realtime broadcast needs no tables and reads no data, so there is
  # nothing behind this key to protect.
  # GEMINI_API_KEY is a real secret and is deliberately NOT here; set it in the
  # Netlify UI. Without it the AI panel serves curated fallbacks.
  VITE_SUPABASE_URL = "https://zrtftliozslrjomxbfrr.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_4JZPu-HuA4MmYFqLW6DcnQ_HkfMvqSn"

# The guide is built as its own HTML entry (vite rollupOptions.input) so it can
# carry its own title, canonical and FAQ structured data. Netlify would resolve
# the pretty URL to that file on its own, but the SPA catch-all below is one
# ordering mistake away from swallowing it and serving the landing page's head
# instead — which is exactly the bug this whole pass exists to fix. Stated
# explicitly, and stated ABOVE the catch-all, because redirect rules are matched
# in file order and the first match wins.
[[redirects]]
  from = "/how-it-works"
  to = "/how-it-works/index.html"
  status = 200

# SPA fallback. Functions and static assets are matched first by Netlify, so
# this only catches client-side routes such as /canvas/:id and /controller/:id.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Generated models are content-addressed by the build and never mutate in
# place, so they can be cached hard.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Every client route soft-200s onto index.html, so without these a crawler that
# finds a shared room link indexes a throwaway session code as a page — with the
# landing page's title and description on it, competing with the landing page
# itself. The rooms are ephemeral and hold no content of their own; only / and
# /how-it-works are worth an index entry. robots.txt disallows the same three
# prefixes, but a Disallow only stops the crawl, not the indexing of a URL
# somebody else linked to; the header is what actually keeps them out.
[[headers]]
  for = "/canvas/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/controller/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The controller needs the motion sensors on the phone that opened it.
    Permissions-Policy = "accelerometer=(self), gyroscope=(self), magnetometer=(self)"
